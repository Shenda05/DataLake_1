server:
  port: 8080

spring:
  application:
    name: data-lake-platform
  datasource:
    url: jdbc:h2:mem:datalake;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: change-me-for-production-demo-secret-2026
    expire-seconds: 7200
  storage:
    root: ${APP_STORAGE_ROOT:../storage}
  data-source:
    duplicate-connection-strategy: ${APP_DATA_SOURCE_DUPLICATE_CONNECTION_STRATEGY:WARN}
  task:
    poll-delay-ms: ${APP_TASK_POLL_DELAY_MS:15000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
